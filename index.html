:root{

  --green:#1e6b3f;--greenl:#edf7f1;

.al{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:12px;line-height:1.5}
.ald{background:var(--redl);color:var(--red);border:1px solid #fcc}
.als{background:var(--greenl);color:var(--green);border:1px solid #b6dfc8}
.ali{background:var(--bluel);color:var(--blue);border:1px solid #b8ccf0}

.btnp{background:var(--blue);color:#fff;border-color:var(--blue)}.btnp:hover{background:var(--blue2)}
.btng{background:var(--green);color:#fff;border-color:var(--green)}
.btnr{background:var(--red);color:#fff;border-color:var(--red)}
.btnbl{width:100%;justify-content:center}
.btnsm{padding:5px 10px;font-size:12px}

#app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:var(--blue);color:#fff;height:52px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.tlogo{font-size:13px;font-weight:700;color:#fff}
.ttitle{font-size:12px;color:#ccd6f0;flex:1}
.tuser{font-size:12px;opacity:.8;display:flex;align-items:center;gap:8px}
.tbtn{border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 10px;font-size:11px;color:#fff;cursor:pointer;background:transparent;font-family:Arial,sans-serif}

.layout{display:flex;flex:1;min-height:calc(100vh - 52px)}
.sidebar{width:200px;background:var(--white);border-right:1px solid var(--graym);padding:10px 0;flex-shrink:0}
.ni{padding:10px 16px;font-size:13px;color:var(--gray);cursor:pointer;border-left:3px solid transparent;font-weight:500}
.ni:hover{background:var(--grayl);color:var(--black)}
.ni.on{background:var(--bluel);color:var(--blue);border-left-color:var(--blue);font-weight:700}
.main{flex:1;padding:24px;overflow-x:auto}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.ptitle{font-size:19px;font-weight:700}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--gray);font-size:13px;cursor:pointer;margin-bottom:14px;font-weight:600}

.ctitle{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.met{background:var(--white);border:1px solid var(--graym);border-radius:var(--rl);padding:14px 16px}
.mlbl{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.mval{font-size:28px;font-weight:700;line-height:1}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--grayl)}
th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--graym);font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--graym);vertical-align:middle}

.pb{height:6px;background:var(--grayl);border-radius:3px;overflow:hidden}

.pfg{background:var(--green)}.pfa{background:#d97706}.pfr{background:var(--red)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}

.numcol{width:32px;text-align:center;color:var(--gray);font-size:11px;font-weight:700}
.rg{display:flex;border:1px solid var(--graym);border-radius:var(--r);overflow:hidden;width:fit-content}
.rb{padding:4px 10px;font-size:11px;font-weight:700;border:none;background:transparent;cursor:pointer;color:var(--gray);border-right:1px solid var(--graym);font-family:Arial,sans-serif}

.rb.na.on{background:var(--grayl);color:var(--black)}

.rb.fail.on{background:var(--redl);color:var(--red)}

.clf{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;border-top:2px solid var(--graym);margin-top:8px;flex-wrap:wrap;gap:12px}
.score-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin:10px 0}
.sc-box{border-radius:var(--r);padding:8px 10px;text-align:center;border:1px solid var(--graym)}
.sc-lbl{font-size:9px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.sc-val{font-size:16px;font-weight:700}
.lbrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--graym)}
.lbrow:last-child{border-bottom:none}
.lbrank{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.r1{background:#fef3c7;color:#92400e}.r2{background:#f1f5f9;color:#475569}.r3{background:var(--redl);color:var(--red)}
.chip{display:inline-block;padding:3px 10px;border-radius:100px;font-size:12px;border:1px solid var(--graym);color:var(--gray);background:var(--grayl)}
.empty{text-align:center;padding:48px 20px;color:var(--gray)}
.eico{font-size:38px;margin-bottom:8px;opacity:.3}
.etxt{font-size:14px;font-weight:700}
.esub{font-size:12px;margin-top:4px}
.sep{height:1px;background:var(--graym);margin:14px 0}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-section{background:var(--bluel);border-radius:var(--r);padding:8px 14px;font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.proj-info{font-size:12px;color:var(--gray);margin-bottom:12px;line-height:1.8}

.loading{text-align:center;padding:40px;color:var(--gray);font-size:13px}
</style>
</head>

async function dbGet(table,query){

    var r=await fetch(SB+'/rest/v1/'+table+'?'+query,{headers:SH});

/* ══ AUTH ══ */
async function doLogin(){
  var name=document.getElementById('lname').value;
  var pass=document.getElementById('lpass').value;
  var al=document.getElementById('lal');
  if(!name||!pass){al.innerHTML='<div class="al ald">Please select your name and enter password.</div>';return;}
  al.innerHTML='<div class="al ali">Signing in...</div>';
  var users=await dbGet('users','name=eq.'+encodeURIComponent(name)+'&select=*');
  if(!users||!users.length){al.innerHTML='<div class="al ald">User not found. Please check connection.</div>';return;}
  var u=users[0];
  if(u.password!==pass){al.innerHTML='<div class="al ald">Incorrect password. Default password = your name.</div>';return;}
  S.user=u.name;S.role=u.role;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('tinfo').textContent=u.name+' — '+roleLabel(u.role);
  buildSidebar();nav('dashboard');
}

function doLogout(){
  S={user:null,role:null,page:'dashboard',proj:null,cat:null,sub:null,cldata:{}};
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('lal').innerHTML='';
  document.getElementById('lpass').value='';
  document.getElementById('lname').value='';
}

function buildSidebar(){
  var items=NAVMAP[S.role]||NAVMAP.supervisor;

function nav(page,ctx){

function render(){
  var mc=document.getElementById('mc');
  mc.innerHTML='<div class="loading">⏳ Loading...</div>';
  var p=S.page;
  if(p==='dashboard')pgDash().then(function(h){mc.innerHTML=h;});

  else if(p==='fill-checklist')pgFillChecklist().then(function(h){mc.innerHTML=h;});
  else if(p==='checklist')pgChecklist().then(function(h){mc.innerHTML=h;});

  else if(p==='all-projects')pgAllProjects().then(function(h){mc.innerHTML=h;});
  else if(p==='review')pgReview().then(function(h){mc.innerHTML=h;});
  else if(p==='leaderboard')pgLeaderboard().then(function(h){mc.innerHTML=h;});
  else if(p==='reports')pgReports().then(function(h){mc.innerHTML=h;});

/* ══ HELPERS ══ */
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){if(!d)return'—';try{var dt=new Date(d);return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
function roleLabel(r){return{supervisor:'Site Supervisor',pm:'Project Manager',admin:'Admin / HOD',director:'Project Director'}[r]||r;}
function getScore(sub){
  var items=sub.items||{};var keys=Object.keys(items);var app=0;var pass=0;
  for(var i=0;i<keys.length;i++){var v=items[keys[i]];if(v&&v.pm){app++;if(v.pm==='pass')pass++;}}
  return app?Math.round(pass/app*100):0;
}
function scCls(s){return s>=90?'cg':s>=70?'ca':'cr';}
function pfCls(s){return s>=90?'pfg':s>=70?'pfa':'pfr';}
function catName(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i].name;return id;}
function findCat(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return null;}

/* ══ DASHBOARD ══ */
async function pgDash(){
  var projs=await dbGet('projects','select=*&order=created_at.desc');
  var allSubs=await dbGet('submissions','select=*');
  var subs=allSubs;
  if(S.role==='supervisor')subs=allSubs.filter(function(s){return s.supervisor===S.user;});
  else if(S.role==='pm')subs=allSubs.filter(function(s){return projs.filter(function(p){return p.pm===S.user;}).map(function(p){return p.name;}).indexOf(s.project)>=0;});
  var total=subs.length;
  var avg=total?Math.round(subs.reduce(function(a,s){return a+getScore(s);},0)/total):0;
  var pending=subs.filter(function(s){return s.status==='pending';}).length;
  var fc=subs.reduce(function(a,s){var items=s.items||{};return a+Object.keys(items).filter(function(k){return items[k]&&items[k].pm==='fail+cost';}).length;},0);
  var h='<div class="ph"><div class="ptitle">Dashboard</div>';
  if(S.role==='pm'||S.role==='admin')h+='<button class="btn btnp btnsm" onclick="nav(\'new-project\')">+ New project</button>';
  if(S.role==='supervisor')h+='<button class="btn btnp btnsm" onclick="nav(\'fill-checklist\')">+ Fill checklist</button>';
  h+='</div>';
  h+='<div class="mgrid">';
  h+='<div class="met"><div class="mlbl">Projects</div><div class="mval cb">'+projs.length+'</div></div>';
  h+='<div class="met"><div class="mlbl">Submissions</div><div class="mval cb">'+total+'</div></div>';
  h+='<div class="met"><div class="mlbl">Avg score</div><div class="mval '+scCls(avg)+'">'+avg+'%</div></div>';
  h+='<div class="met"><div class="mlbl">Pending review</div><div class="mval ca">'+pending+'</div></div>';
  h+='<div class="met"><div class="mlbl">Fail+Cost</div><div class="mval cr">'+fc+'</div></div>';
  h+='</div>';
  h+='<div class="card"><div class="ctitle">Projects</div>';
  if(!projs.length)h+='<div class="empty"><div class="eico">🏗️</div><div class="etxt">No projects yet</div></div>';
  else{
    h+='<div class="tw"><table><thead><tr><th>Project</th><th>Location</th><th>Supervisor</th><th>Takeover</th><th>Handover</th><th>Progress</th><th>Status</th></tr></thead><tbody>';
    projs.forEach(function(p){
      var ps=allSubs.filter(function(s){return s.project===p.name&&s.status!=='draft';});
      var pct=Math.round(ps.length/12*100);
      h+='<tr><td style="font-weight:700">'+p.name+'</td><td>'+(p.location||'—')+'</td><td>'+(p.supervisor||'—')+'</td>';
      h+='<td>'+fmtDate(p.takeover_date)+'</td><td>'+fmtDate(p.handover_date)+'</td>';
      h+='<td><div style="display:flex;align-items:center;gap:8px"><div class="pb" style="width:80px"><div class="pf '+pfCls(pct)+'" style="width:'+pct+'%"></div></div><span style="font-size:11px;color:var(--gray)">'+ps.length+'/12</span></div></td>';
      h+='<td><span class="bdg '+(p.status==='active'?'bg':'bn')+'">'+(p.status||'active')+'</span></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  return h;
}

/* ══ MY PROJECTS ══ */
async function pgMyProjects(){
  var projs=await dbGet('projects','supervisor=eq.'+encodeURIComponent(S.user)+'&select=*');
  var subs=await dbGet('submissions','supervisor=eq.'+encodeURIComponent(S.user)+'&select=*');
  var h='<div class="ph"><div class="ptitle">My projects</div><button class="btn btnp btnsm" onclick="nav(\'fill-checklist\')">+ Fill checklist</button></div>';
  if(!projs.length)return h+'<div class="empty"><div class="eico">🏗️</div><div class="etxt">No projects assigned</div><div class="esub">Ask your PM to create a project and assign you.</div></div>';
  projs.forEach(function(p){
    var ps=subs.filter(function(s){return s.project===p.name;});
    var done=ps.filter(function(s){return s.status!=='draft';}).length;
    var pct=Math.round(done/12*100);
    h+='<div class="card"><div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">';
    h+='<div style="font-size:15px;font-weight:700">'+p.name+'</div><span class="chip">'+done+'/12 done</span></div>';
    h+='<div class="proj-info">📍 <span>'+(p.location||'—')+'</span> &nbsp;|&nbsp; PM: <span>'+(p.pm||'—')+'</span> &nbsp;|&nbsp; Takeover: <span>'+fmtDate(p.takeover_date)+'</span> &nbsp;|&nbsp; Handover: <span>'+fmtDate(p.handover_date)+'</span></div>';
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div class="pb" style="flex:1"><div class="pf '+pfCls(pct)+'" style="width:'+pct+'%"></div></div><span style="font-size:12px;font-weight:700;color:var(--gray)">'+pct+'%</span></div>';
    h+='<div class="catgrid">';
    CATS.forEach(function(cat){
      var sub=null;var draft=null;
      ps.forEach(function(s){if(s.category===cat.id){if(s.status==='draft')draft=s;else sub=s;}});
      var cls=sub?(sub.status==='returned'?'returned':'done'):draft?'draft':'';
      var score=sub?getScore(sub):0;
      h+='<div class="catcard '+cls+'" onclick="openChecklist(\''+p.name+'\',\''+cat.id+'\')">';
      h+='<div class="catname">'+cat.name+'</div><div class="catmeta"><span>'+totalItems(cat)+' items</span>';
      if(sub&&sub.status==='approved')h+='<span class="bdg bg">'+score+'%</span>';
      else if(sub&&sub.status==='returned')h+='<span class="bdg br">Returned</span>';
      else if(sub&&sub.status==='pending')h+='<span class="bdg bw">Pending</span>';
      else if(draft)h+='<span class="bdg bn">Draft</span>';
      else h+='<span class="bdg bn">Pending</span>';
      h+='</div></div>';
    });
    h+='</div></div>';
  });
  return h;
}

function goChecklist(){

async function openChecklist(proj,catid){
  document.getElementById('mc').innerHTML='<div class="loading">⏳ Loading checklist...</div>';
  var subs=await dbGet('submissions','project=eq.'+encodeURIComponent(proj)+'&category=eq.'+catid+'&supervisor=eq.'+encodeURIComponent(S.user)+'&select=*');

/* ══ CHECKLIST ══ */
async function pgChecklist(){
  var cat=findCat(S.cat);
  if(!cat)return'<div class="empty"><div class="etxt">Category not found.</div></div>';
  var existing=S.sub;
  var submitted=existing&&existing.status!=='draft';
  var isPM=(S.role==='pm'||S.role==='admin');
  var h='<div class="back" onclick="nav(\'my-projects\')">&#8592; Back to my projects</div>';
  h+='<div class="ph"><div><div class="ptitle">'+cat.name+'</div>';
  h+='<div style="font-size:12px;color:var(--gray);margin-top:2px">Project: <strong>'+S.proj+'</strong> &nbsp;|&nbsp; Supervisor: <strong>'+(S.sub?S.sub.supervisor:S.user)+'</strong></div></div></div>';
  if(submitted){
    h+='<div class="al '+(existing.status==='approved'?'als':existing.status==='returned'?'ald':'ali')+'" style="margin-bottom:14px">';
    h+='Status: <strong>'+(existing.status==='approved'?'✅ Approved':existing.status==='returned'?'⚠️ Returned — please recheck and resubmit':'⏳ Pending PM review')+'</strong>';

    h+='</div>';

  }
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12px">';
  h+='<div style="background:var(--bluel);border:1px solid var(--bluem);border-radius:6px;padding:5px 12px;color:var(--blue)"><strong>Supervisor fills:</strong> Check (Yes/N/A) &nbsp;|&nbsp; Remarks</div>';
  h+='<div style="background:var(--goldl);border:1px solid var(--gold);border-radius:6px;padding:5px 12px;color:var(--goldd)"><strong>PM fills:</strong> Pass &nbsp;|&nbsp; Fail &nbsp;|&nbsp; Fail+Cost</div>';

      var k='i'+idx;

      h+='<button class="rb na'+(v.check==='na'?' on':'')+'" '+supDis+' onclick="setCheck(\''+k+'\',\'na\',this)">N/A</button>';
      h+='</div></td>';

      h+='<td class="pm-col">';
      if(!submitted){h+='<div class="pmblank">PM fills</div>';}
      else{
        h+='<div class="rg">';
        h+='<button class="rb pass'+(v.pm==='pass'?' on':'')+'" '+pmDis+' onclick="setPM(\''+k+'\',\'pass\',this)">Pass</button>';
        h+='<button class="rb fail'+(v.pm==='fail'?' on':'')+'" '+pmDis+' onclick="setPM(\''+k+'\',\'fail\',this)">Fail</button>';

    h+='<button class="btn btnsm" onclick="pmSave(this)">💾 Save</button>';
    h+='<button class="btn btng btnsm" onclick="pmApprove(this)">✓ Approve</button>';
    h+='<button class="btn btnr btnsm" onclick="pmReject(this)">✗ Reject</button>';
    h+='</div></div>';
  }
  h+='</div>';
  return h;
}

function setCheck(k,val,btn){
  if(!S.cldata[k])S.cldata[k]={};S.cldata[k].check=val;
  btn.closest('.rg').querySelectorAll('.rb').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');
}
function setRemark(k,val){if(!S.cldata[k])S.cldata[k]={};S.cldata[k].remarks=val;}
function setPM(k,val,btn){
  if(!S.cldata[k])S.cldata[k]={};S.cldata[k].pm=val;
  btn.closest('.rg').querySelectorAll('.rb').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');
  var pass_c=0,fail_c=0,fc_c=0;
  Object.keys(S.cldata).forEach(function(key){var v=S.cldata[key];if(v){if(v.pm==='pass')pass_c++;else if(v.pm==='fail')fail_c++;else if(v.pm==='fail+cost')fc_c++;}});
  var pm_tot=pass_c+fail_c+fc_c;
  var score=pm_tot?Math.round(pass_c/pm_tot*100):0;
  var boxes=document.querySelectorAll('.sc-box .sc-val');
  if(boxes.length>=4){boxes[0].textContent=score+'%';boxes[0].className='sc-val '+scCls(score);boxes[1].textContent=pass_c;boxes[2].textContent=fail_c;boxes[3].textContent=fc_c;}
}

async function saveDraft(btn){
  btn.textContent='Saving...';btn.disabled=true;
  if(S.sub){
    await dbPatch('submissions','id=eq.'+S.sub.id,{items:S.cldata,updated_at:new Date().toISOString()});
  } else {
    var res=await dbPost('submissions',{project:S.proj,category:S.cat,supervisor:S.user,status:'draft',items:S.cldata,updated_at:new Date().toISOString()});
    if(res&&res.length)S.sub=res[0];
  }
  btn.textContent='Saved!';setTimeout(function(){btn.textContent='💾 Save draft';btn.disabled=false;},2000);
}

async function submitCL(btn){
  var cat=findCat(S.cat);
  var ans=Object.keys(S.cldata).filter(function(k){return S.cldata[k]&&S.cldata[k].check;}).length;
  if(ans<totalItems(cat)&&!confirm('Only '+ans+'/'+totalItems(cat)+' items answered. Submit anyway?'))return;
  btn.textContent='Submitting...';btn.disabled=true;
  if(S.sub){
    await dbPatch('submissions','id=eq.'+S.sub.id,{items:S.cldata,status:'pending',submitted_at:today(),updated_at:new Date().toISOString()});
  } else {
    var res=await dbPost('submissions',{project:S.proj,category:S.cat,supervisor:S.user,status:'pending',items:S.cldata,submitted_at:today(),updated_at:new Date().toISOString()});
    if(res&&res.length)S.sub=res[0];
  }
  await openChecklist(S.proj,S.cat);
}

async function reOpenChecklist(){
  if(S.sub)await dbPatch('submissions','id=eq.'+S.sub.id,{status:'draft',pm_comment:null,updated_at:new Date().toISOString()});
  await openChecklist(S.proj,S.cat);
}

async function pmSave(btn){
  if(!S.sub)return;
  btn.textContent='Saving...';btn.disabled=true;
  await dbPatch('submissions','id=eq.'+S.sub.id,{items:S.cldata,updated_at:new Date().toISOString()});
  btn.textContent='Saved!';setTimeout(function(){btn.textContent='💾 Save';btn.disabled=false;},2000);
}

async function pmApprove(btn){
  if(!S.sub)return;
  btn.textContent='Approving...';btn.disabled=true;
  await dbPatch('submissions','id=eq.'+S.sub.id,{items:S.cldata,status:'approved',updated_at:new Date().toISOString()});
  nav('review');
}

async function pmReject(btn){
  var comment=prompt('Reason for rejection (will be shown to supervisor):');
  if(comment===null)return;
  btn.textContent='Rejecting...';btn.disabled=true;
  await dbPatch('submissions','id=eq.'+S.sub.id,{items:S.cldata,status:'returned',pm_comment:comment,updated_at:new Date().toISOString()});
  nav('review');
}

async function saveProject(){
  var name=document.getElementById('pf-name').value.trim();
  var loc=document.getElementById('pf-loc').value.trim();
  var take=document.getElementById('pf-take').value;
  var hand=document.getElementById('pf-hand').value;

  var sup=document.getElementById('pf-sup').value;
  var al=document.getElementById('pf-al');

/* ══ ALL PROJECTS ══ */
async function pgAllProjects(){
  var projs=await dbGet('projects','select=*&order=created_at.desc');
  var subs=await dbGet('submissions','select=*');
  var h='<div class="ph"><div class="ptitle">All projects</div>';
  if(S.role==='pm'||S.role==='admin')h+='<button class="btn btnp btnsm" onclick="nav(\'new-project\')">+ New project</button>';
  h+='</div>';
  if(!projs.length)return h+'<div class="empty"><div class="eico">🏗️</div><div class="etxt">No projects yet</div></div>';
  h+='<div class="card"><div class="tw"><table><thead><tr><th>Project name</th><th>Location</th><th>PM</th><th>Supervisor</th><th>Takeover</th><th>Handover</th><th>Progress</th><th>Avg score</th><th>Status</th></tr></thead><tbody>';
  projs.forEach(function(p){
    var ps=subs.filter(function(s){return s.project===p.name&&s.status!=='draft';});
    var av=ps.length?Math.round(ps.reduce(function(a,s){return a+getScore(s);},0)/ps.length):0;
    var pct=Math.round(ps.length/12*100);
    h+='<tr><td style="font-weight:700">'+p.name+'</td><td>'+(p.location||'—')+'</td><td>'+(p.pm||'—')+'</td><td>'+(p.supervisor||'—')+'</td>';
    h+='<td>'+fmtDate(p.takeover_date)+'</td><td>'+fmtDate(p.handover_date)+'</td>';
    h+='<td><div style="display:flex;align-items:center;gap:6px"><div class="pb" style="width:70px"><div class="pf '+pfCls(pct)+'" style="width:'+pct+'%"></div></div><span style="font-size:11px;color:var(--gray)">'+ps.length+'/12</span></div></td>';
    h+='<td>'+(ps.length?'<span class="'+scCls(av)+'" style="font-weight:700">'+av+'%</span>':'—')+'</td>';
    h+='<td><span class="bdg '+(p.status==='active'?'bg':'bn')+'">'+(p.status||'active')+'</span></td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

/* ══ REVIEW ══ */
async function pgReview(){
  var allSubs=await dbGet('submissions','status=eq.pending&select=*&order=updated_at.desc');
  var projs=await dbGet('projects','select=name,pm');
  if(S.role==='pm'){
    var myP=projs.filter(function(p){return p.pm===S.user;}).map(function(p){return p.name;});
    allSubs=allSubs.filter(function(s){return myP.indexOf(s.project)>=0;});
  }
  var h='<div class="ph"><div class="ptitle">Review submissions</div><span class="chip">'+allSubs.length+' pending</span></div>';
  if(!allSubs.length)return h+'<div class="empty"><div class="eico">✅</div><div class="etxt">No pending submissions</div><div class="esub">All submissions have been reviewed.</div></div>';
  h+='<div class="card"><div class="tw"><table><thead><tr><th>Project</th><th>Category</th><th>Supervisor</th><th>Score</th><th>Fail</th><th>Fail+Cost</th><th>Date</th><th>Action</th></tr></thead><tbody>';
  allSubs.forEach(function(s){
    var items=s.items||{};var keys=Object.keys(items);
    var fail_c=keys.filter(function(k){return items[k]&&items[k].pm==='fail';}).length;
    var fc_c=keys.filter(function(k){return items[k]&&items[k].pm==='fail+cost';}).length;
    var sc=getScore(s);
    h+='<tr><td style="font-weight:700">'+s.project+'</td><td>'+catName(s.category)+'</td><td>'+s.supervisor+'</td>';
    h+='<td><span class="'+scCls(sc)+'" style="font-weight:700">'+sc+'%</span></td>';
    h+='<td>'+(fail_c?'<span class="bdg br">'+fail_c+'</span>':'—')+'</td>';
    h+='<td>'+(fc_c?'<span class="bdg bo">'+fc_c+'</span>':'—')+'</td>';
    h+='<td>'+(s.submitted_at?fmtDate(s.submitted_at):'—')+'</td>';
    h+='<td><button class="btn btnsm" onclick="openReview(\''+s.id+'\',\''+s.project+'\',\''+s.category+'\',\''+s.supervisor+'\')">Review &rarr;</button></td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

async function openReview(subId,proj,catid,supervisor){
  document.getElementById('mc').innerHTML='<div class="loading">⏳ Loading...</div>';
  var subs=await dbGet('submissions','id=eq.'+subId+'&select=*');
  var existing=subs.length?subs[0]:null;
  S.cldata=existing?JSON.parse(JSON.stringify(existing.items||{})):{};
  S.sub=existing||null;
  nav('checklist',{proj:proj,cat:catid});
}

/* ══ LEADERBOARD ══ */
async function pgLeaderboard(){
  var subs=await dbGet('submissions','status=in.(approved,pending)&select=*');
  var h='<div class="ph"><div class="ptitle">Supervisor leaderboard</div></div>';
  var map={};
  subs.forEach(function(s){
    if(!map[s.supervisor])map[s.supervisor]={name:s.supervisor,scores:[],count:0};
    map[s.supervisor].scores.push(getScore(s));map[s.supervisor].count++;
  });
  var ranked=Object.values(map).map(function(s){var sum=0;s.scores.forEach(function(v){sum+=v;});return{name:s.name,avg:Math.round(sum/s.scores.length),count:s.count};}).sort(function(a,b){return b.avg-a.avg;});
  if(!ranked.length)return h+'<div class="empty"><div class="eico">🏆</div><div class="etxt">No data yet</div></div>';
  h+='<div class="card">';
  ranked.forEach(function(s,i){
    var rk=i===0?'r1':i===1?'r2':i===2?'r3':'';
    h+='<div class="lbrow"><div class="lbrank '+rk+'" style="background:'+(i>=3?'var(--grayl)':'')+'">'+( i+1)+'</div>';
    h+='<div style="flex:1"><div class="lbname">'+s.name+'</div><div style="font-size:11px;color:var(--gray)">'+s.count+' submission'+(s.count!==1?'s':'')+'</div></div>';
    h+='<div style="font-size:22px;font-weight:700" class="'+scCls(s.avg)+'">'+s.avg+'%</div></div>';
  });
  h+='</div>';
  return h;
}

/* ══ REPORTS ══ */
async function pgReports(){
  var subs=await dbGet('submissions','select=*');
  var projs=await dbGet('projects','select=*');
  var total=subs.length;
  var approved=subs.filter(function(s){return s.status==='approved';}).length;
  var fc=subs.reduce(function(a,s){var items=s.items||{};return a+Object.keys(items).filter(function(k){return items[k]&&items[k].pm==='fail+cost';}).length;},0);
  var fails=subs.reduce(function(a,s){var items=s.items||{};return a+Object.keys(items).filter(function(k){return items[k]&&items[k].pm==='fail';}).length;},0);
  var h='<div class="ph"><div class="ptitle">Reports</div></div>';
  h+='<div class="mgrid">';
  h+='<div class="met"><div class="mlbl">Total submissions</div><div class="mval cb">'+total+'</div></div>';
  h+='<div class="met"><div class="mlbl">Approved</div><div class="mval cg">'+approved+'</div></div>';
  h+='<div class="met"><div class="mlbl">Fail+Cost flags</div><div class="mval ca">'+fc+'</div></div>';
  h+='<div class="met"><div class="mlbl">Fail items</div><div class="mval cr">'+fails+'</div></div>';
  h+='</div><div class="twocol">';
  h+='<div class="card"><div class="ctitle">Category performance</div>';
  var catData=[];
  CATS.forEach(function(c){
    var cs=subs.filter(function(s){return s.category===c.id;});
    if(!cs.length)return;
    var sum=0;cs.forEach(function(s){sum+=getScore(s);});
    catData.push({name:c.name,av:Math.round(sum/cs.length)});
  });
  catData.sort(function(a,b){return a.av-b.av;});
  if(!catData.length)h+='<div class="empty" style="padding:20px"><div class="etxt">No data yet</div></div>';
  else catData.forEach(function(c){
    h+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:13px">'+c.name+'</span><span class="'+scCls(c.av)+'" style="font-weight:700">'+c.av+'%</span></div>';
    h+='<div class="pb"><div class="pf '+pfCls(c.av)+'" style="width:'+c.av+'%"></div></div></div>';
  });
  h+='</div>';
  h+='<div class="card"><div class="ctitle">Project scores</div>';
  if(!projs.length)h+='<div class="empty" style="padding:20px"><div class="etxt">No projects yet</div></div>';
  else projs.forEach(function(p){
    var ps=subs.filter(function(s){return s.project===p.name&&s.status!=='draft';});
    var pct=Math.round(ps.length/12*100);
    var av=ps.length?Math.round(ps.reduce(function(a,s){return a+getScore(s);},0)/ps.length):0;
    h+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:13px;font-weight:700">'+p.name+'</span><span style="font-size:12px;color:var(--gray)">'+ps.length+'/12 '+(av?'<span class="'+scCls(av)+'" style="font-weight:700">'+av+'%</span>':'')+'</span></div>';
    h+='<div class="pb"><div class="pf '+pfCls(pct)+'" style="width:'+pct+'%"></div></div></div>';
  });
  h+='</div></div>';
  return h;
}

async function doResetPw(){
  var name=document.getElementById('ru-name').value;
  var pass=document.getElementById('ru-pass').value;
  var al=document.getElementById('ru-al');
  if(!name||!pass){al.innerHTML='<div class="al ald">Fill in both fields.</div>';return;}
  al.innerHTML='<div class="al ali">Saving...</div>';
  var res=await dbPatch('users','name=eq.'+encodeURIComponent(name),{password:pass});
  if(res)al.innerHTML='<div class="al als">✓ Password reset for '+name+'.</div>';
  else al.innerHTML='<div class="al ald">Failed. Please try again.</div>';
}

async function doChangePw(){
  var cur=document.getElementById('cp-cur').value;
  var nw=document.getElementById('cp-new').value;
  var con=document.getElementById('cp-con').value;
  var al=document.getElementById('cp-al');
  if(!cur||!nw||!con){al.innerHTML='<div class="al ald">Please fill in all fields.</div>';return;}
  if(nw!==con){al.innerHTML='<div class="al ald">New passwords do not match.</div>';return;}
  if(nw.length<4){al.innerHTML='<div class="al ald">Password must be at least 4 characters.</div>';return;}
  var users=await dbGet('users','name=eq.'+encodeURIComponent(S.user)+'&select=*');
  if(!users||!users.length){al.innerHTML='<div class="al ald">User not found.</div>';return;}
  if(users[0].password!==cur){al.innerHTML='<div class="al ald">Current password is incorrect.</div>';return;}
  var res=await dbPatch('users','name=eq.'+encodeURIComponent(S.user),{password:nw});
  if(res)al.innerHTML='<div class="al als">✓ Password updated successfully!</div>';
  else al.innerHTML='<div class="al ald">Failed to update. Please try again.</div>';
}
